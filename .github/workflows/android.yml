# Android uygulamasını derler ve imzalar. Dosya, çalıştırmanın sayfasındaki "Artifacts" bölümünden indirilir.
#
# Çalıştırmak için: GitHub → Actions → "Android AAB" → Run workflow → paket türünü seç:
#   - aab       : Play Console'a yüklenecek paket (gerçek reklamlar)
#   - test-apk  : telefona doğrudan kurmak için APK (Google'ın TEST reklamları; kendi telefonunda güvenle denenir)
#
# Gerekenler (GitHub → Settings → Secrets and variables → Actions):
#   Variables:  APP_API_BASE (https://...onrender.com), GOOGLE_CLIENT_ID,
#               ADMOB_APP_ID, ADMOB_BANNER_ID, ADMOB_INTERSTITIAL_ID  (AdMob olmadan TEST reklamları kullanılır)
#   Secrets:    KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Android AAB

on:
  workflow_dispatch:
    inputs:
      paket:
        description: 'Paket türü'
        type: choice
        options: ['aab', 'test-apk']
        default: 'aab'
  push:
    tags: ['v*']

# GITHUB_TOKEN sadece kodu okuyabilsin
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Etiketle tetiklenince giriş yoktur: aab
      PAKET: ${{ inputs.paket || 'aab' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # cache: gradle -> Android kütüphaneleri önbelleğe alınır; her derlemede Maven'dan tekrar indirilmez
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Android SDK, GitHub'ın ubuntu sunucularında hazır gelir (ANDROID_HOME). İmza anahtarı bu işte
      # kullanıldığı için üçüncü taraf eylem çalıştırılmaz; sadece GitHub'ın kendi actions/* eylemleri var.
      - name: Android SDK kontrol
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK -> $ANDROID_HOME"

      - name: Bağımlılıklar
        run: npm ci

      # test-apk: reklam birimi kimlikleri verilmez -> build-app.mjs Google'ın TEST birimlerini kullanır
      - name: Web dosyaları (www/)
        run: npm run build:app
        env:
          APP_API_BASE: ${{ vars.APP_API_BASE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ADMOB_BANNER_ID: ${{ env.PAKET == 'aab' && vars.ADMOB_BANNER_ID || '' }}
          ADMOB_INTERSTITIAL_ID: ${{ env.PAKET == 'aab' && vars.ADMOB_INTERSTITIAL_ID || '' }}

      - name: Capacitor senkron
        run: npx cap sync android

      - name: İmza anahtarı
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"

      - name: Derle
        working-directory: android
        run: |
          chmod +x gradlew
          TASK=bundleRelease
          if [ "$PAKET" = "test-apk" ]; then TASK=assembleRelease; fi
          echo "Gradle görevi: $TASK"
          # Maven sunucusu geçici olarak "çok fazla istek" (429) dönebilir: başarısız olursa bekleyip bir kez daha dene
          ./gradlew $TASK --no-daemon || (sleep 60 && ./gradlew $TASK --no-daemon)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

      - if: env.PAKET == 'aab'
        uses: actions/upload-artifact@v4
        with:
          name: match-baller-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - if: env.PAKET == 'test-apk'
        uses: actions/upload-artifact@v4
        with:
          name: match-baller-test-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
