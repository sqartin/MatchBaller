# Render Blueprint: Match Baller sunucusu (ücretsiz plan)
# Render → New → Blueprint → bu depoyu seç. Ayarlar buradan otomatik okunur.
#
# Ücretsiz planda kalıcı disk yok: kullanıcı verisi MongoDB Atlas'ın ücretsiz veritabanında tutulur (MONGODB_URI).
# Ücretsiz plan 15 dakika boşta kalınca uyur; ilk giren oyuncu yaklaşık 1 dakika bekleyebilir.
services:
  - type: web
    name: match-baller
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Aşağıdakileri Render panelinde sen gir (sync: false = depoya yazılmaz)
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ANDROID_PACKAGE
        sync: false
      - key: ANDROID_SHA256
        sync: false
      - key: ADMOB_PUBLISHER_ID
        sync: false
